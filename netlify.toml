[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/suggest"
  to = "/.netlify/functions/suggest"
  status = 200

[[redirects]]
  from = "/api/summary"
  to = "/.netlify/functions/summary"
  status = 200

[[redirects]]
  from = "/api/dictate"
  to = "/.netlify/functions/dictate"
  status = 200
