<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Логопедическое заключение</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Конструктор заключений</p>
          <h1>Логопедическая диагностика</h1>
        </div>
        <div class="top-actions">
          <select id="draftSelect" aria-label="Черновики"></select>
          <button id="loadDraftBtn" class="secondary">Открыть</button>
          <button id="deleteDraftBtn" class="ghost">Удалить</button>
          <button id="saveDraftBtn" class="primary">Сохранить</button>
        </div>
      </header>

      <main class="workspace">
        <section class="editor-pane" aria-label="Редактор заключения">
          <div class="panel identity-panel">
            <div class="panel-title-row">
              <h2>Карточка</h2>
              <button id="newReportBtn" class="secondary">Новое заключение</button>
            </div>
            <div class="form-grid">
              <label>
                <span>ФИО ребенка</span>
                <input id="childName" autocomplete="off" placeholder="Иванова Мария" />
              </label>
              <label>
                <span>Дата рождения</span>
                <input id="birthDate" type="date" />
              </label>
              <label>
                <span>Дата диагностики</span>
                <input id="diagnosisDate" type="date" />
              </label>
              <label>
                <span>Пол</span>
                <select id="gender">
                  <option value="male">мальчик</option>
                  <option value="female">девочка</option>
                </select>
              </label>
              <label class="wide">
                <span>Повод обращения</span>
                <textarea id="reason" rows="2" placeholder="алалия, наблюдаемая в раннем возрасте"></textarea>
              </label>
              <label class="wide">
                <span>Анамнез</span>
                <textarea id="anamnesis" rows="4"></textarea>
              </label>
              <label class="wide">
                <span>Специалист</span>
                <input id="specialist" value="Потапова Ирина Александровна" />
              </label>
            </div>
          </div>

          <div class="panel assistant-panel">
            <div class="panel-title-row">
              <h2>Помощник</h2>
              <div class="compact-actions">
                <button id="checkBtn" class="secondary">Проверить</button>
                <button id="polishBtn" class="secondary">Вычитать</button>
              </div>
            </div>
            <div id="assistantOutput" class="assistant-output"></div>
          </div>

          <div class="dictation-launch">
            <button id="dictateReportBtn" class="dictate-main-btn secondary" type="button">
              <span class="mic-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 15a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Z" />
                  <path d="M19 11a7 7 0 0 1-14 0" />
                  <path d="M12 18v4" />
                  <path d="M8 22h8" />
                </svg>
              </span>
              <span>Наговорить</span>
            </button>
          </div>

          <div id="sections" class="sections"></div>

          <div class="panel">
            <div class="panel-title-row">
              <h2>Заключение</h2>
              <div class="conclusion-actions">
                <select id="conclusionPreset" aria-label="Вариант заключения"></select>
                <button id="summaryBtn" class="secondary">ИИ резюме</button>
              </div>
            </div>
            <textarea id="conclusion" rows="3"></textarea>
          </div>

          <div class="panel">
            <div class="panel-title-row">
              <h2>Рекомендации</h2>
              <button id="addRecommendationBtn" class="secondary">Добавить</button>
            </div>
            <div id="recommendations" class="recommendations"></div>
            <div class="inline-add">
              <input id="customRecommendation" placeholder="Новая рекомендация" />
            </div>
          </div>
        </section>

        <aside class="preview-pane" aria-label="Предпросмотр заключения">
          <div class="preview-toolbar">
            <div>
              <p class="eyebrow">Предпросмотр</p>
              <h2>Готовый текст</h2>
            </div>
            <div class="compact-actions">
              <button id="copyBtn" class="secondary">Копировать</button>
              <button id="docxBtn" class="primary">DOCX</button>
              <button id="pdfBtn" class="primary">PDF</button>
            </div>
          </div>
          <article id="documentPreview" class="document-page"></article>
        </aside>
      </main>
    </div>

    <dialog id="draftDialog" class="draft-dialog" aria-labelledby="draftDialogTitle">
      <form method="dialog" class="draft-dialog-body">
        <h2 id="draftDialogTitle">Сохранить черновик</h2>
        <p id="draftDialogText" class="draft-dialog-text"></p>
        <label>
          <span>Название черновика</span>
          <input id="draftTitleInput" autocomplete="off" />
        </label>
        <div class="draft-dialog-actions">
          <button id="draftCancelBtn" value="cancel" class="ghost">Отмена</button>
          <button id="draftSkipBtn" value="skip" class="secondary" hidden>Не сохранять</button>
          <button id="draftConfirmBtn" value="save" class="primary">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="./templateDocx.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
